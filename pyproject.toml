[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automix-skill"
version = "0.1.0"
description = "Mixxx-aware, inspectable two-track MP3 mixing for coding agents"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
dependencies = [
  "numpy>=1.24,<3", "scipy>=1.11,<2", "librosa>=0.10.2,<0.12",
  "soundfile>=0.12,<0.14", "imageio-ffmpeg>=0.5,<0.7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
agent-mix = "mixxx_agent_mix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
